name: Soccer Score Monitor

on:
  schedule:
    # 每 10 分钟运行一次（与 70→80 分钟窗口匹配）
    # GitHub Actions cron 用 UTC，*/10 表示每 10 分钟
    # 注意：GitHub 不保证准时，延迟 1-15 分钟均属正常
    - cron: '*/10 * * * *'
  workflow_dispatch:
    # 允许手动触发，方便测试新版本

permissions:
  contents: read

# 同一时间只允许一个实例运行，避免短时间内重复触发钉钉
# 不取消正在运行的实例（避免漏掉预警）
concurrency:
  group: soccer-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --quiet requests openai

      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: state
          key: soccer-state-${{ github.run_id }}
          restore-keys: |
            soccer-state-

      - name: Run monitor
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com
          DEEPSEEK_MODEL: deepseek-chat
        run: |
          python soccer_monitor.py
